      tags: [Internal — Dev tools]
      summary: Decrypt stored channel token (dev only)
      description: |
        Mounted only when `OLLIE_DEV_TOKEN_DECRYPT_SECRET` is set at API startup.
      operationId: postInternalDevTokenDecrypt
      security:
        - devTokenDecryptSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide one of the ciphertext field names
              properties:
                accessTokenEncrypted:
