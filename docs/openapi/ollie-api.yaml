        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Route not mounted (secret not configured)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token; requires registered tenant (`requireAuth`).
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token; valid JWT only (`requireToken`, e.g. pre-registration).
    n8nSecret:
      type: apiKey
      in: header
      name: x-n8n-secret
      description: Must match `N8N_CALLBACK_SECRET`.
    dailyHookPipelineSecret:
      type: apiKey
      in: header
      name: X-Ollie-Daily-Hook-Pipeline-Secret
      description: Must match `OLLIE_DAILY_HOOK_PIPELINE_SECRET`.
    accountPipelineSecret:
      type: apiKey
      in: header
      name: X-Ollie-Account-Pipeline-Secret
      description: Must match `OLLIE_ACCOUNT_PIPELINE_SECRET`.
    notificationDispatchSecret:
      type: apiKey
      in: header
      name: X-Ollie-Notification-Dispatch-Secret
      description: Must match `OLLIE_NOTIFICATION_DISPATCH_SECRET` (falls back to daily hook secret in dev).
    devTokenDecryptSecret:
      type: apiKey
      in: header
      name: X-Ollie-Dev-Token-Decrypt-Secret
      description: Must match `OLLIE_DEV_TOKEN_DECRYPT_SECRET`.

  parameters:
    HookId:
      name: hookId
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
    ChannelVersionId:
      name: channelVersionId
      in: path
      required: true
      schema:
        type: string
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
    CursorQuery:
      name: cursor
      in: query
      schema:
        type: string

  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          required: [timestamp]
          properties:
            timestamp:
              type: string
              format: date-time
          additionalProperties: true

    SuccessEnvelopeHealth:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: ok

    ProblemDetail:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      additionalProperties: true

    TodayHookCard:
      type: object
      required: [id, templateId, headline, reasoning, category, alternatives]
      properties:
        id:
          type: string
        templateId:
          type: string
        headline:
          type: string
        reasoning:
          type: string
        category:
          type: string
        photoUrl:
          type: string
          format: uri
        alternatives:
          type: array
          items:
            type: object
            required: [id, templateId, headline, reasoning, category]
            properties:
              id:
                type: string
              templateId:
                type: string
              headline:
                type: string
              reasoning:
                type: string
              category:
                type: string
              photoUrl:
                type: string
                format: uri

    TodayPublishRequest:
      type: object
      required: [contentId, channelIds]
      properties:
        contentId:
          type: string
          description: Content draft id
        channelIds:
          type: array
          minItems: 1
          items:
            type: string
        channelOptOuts:
          type: array
          items:
            type: string
        businessId:
          type: string
          description: Must match authenticated tenant if provided
        publishTraceId:
          type: string
        clientSource:
          type: string
          enum: [today, draft]

    LlmHookSlot:
      type: object
      required: [templateId, hookCategory, headline, reasoning]
      properties:
        templateId:
          type: string
        hookCategory:
          type: string
        headline:
          type: string
        reasoning:
          type: string

  responses:
    SuccessJson:
      description: Success envelope with route-specific `data`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    SuccessEmpty:
      description: Success with minimal or empty data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict (stale state or business rule)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Validation failed (often includes `fields` extension)
      content:
