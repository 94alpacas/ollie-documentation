openapi: 3.0.3
info:
  title: Ollie API
  version: 0.1.0
  description: |
    HTTP API for the Ollie mobile app, n8n workflows, and internal pipeline workers.

    **Base path:** All routes are mounted under `/api` (see `servers`).

    **Success responses** use a JSON envelope `{ "data": T, "meta": { "timestamp": "...", ... } }`.

    **Error responses** use [RFC 7807 Problem Details](https://datatracker.ietf.org/doc/html/rfc7807)
    (`application/problem+json`): `{ "type", "title", "status", "detail", ... }`.

    **Auth:** App routes expect `Authorization: Bearer <Auth0 access token>`.
    Internal routes use dedicated `X-Ollie-*` secrets (see security schemes).

    Generated from route modules in `ollie-api/src/routes/`. Re-import after API changes.
  contact:
    name: 94 Alpacas — Ollie
  license:
    name: Proprietary
    url: https://94alpacas.com

servers:
  - url: http://localhost:3000/api
    description: Local development (`PORT` defaults to 3000)
  - url: https://api.example.com/api
    description: Production (replace host with deployed API URL)

tags:
  - name: Health
  - name: Auth
  - name: Settings
  - name: Business
  - name: Onboarding
  - name: Today
  - name: Channels
  - name: Assets
  - name: Internal — Account deletion
  - name: Internal — Daily hooks & content
  - name: Internal — Notifications
  - name: Internal — Publish
  - name: Internal — Publish resilience
  - name: Internal — Dev tools

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelopeHealth'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user and provision tenant (Business)
      operationId: postAuthRegister
      security:
        - bearerToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user and business
      operationId: getAuthMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant context
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [uid, businessId]
                        properties:
                          uid:
                            type: string
                          businessId:
                            type: string
                          preferredDisplayName:
                            type: string
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/business-profile:
    get:
      tags: [Settings]
      summary: Get business profile (settings)
      operationId: getSettingsBusinessProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Settings]
      summary: Update business profile (settings)
      operationId: patchSettingsBusinessProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /settings/notification-preferences:
    get:
      tags: [Settings]
      summary: Get notification preferences
      operationId: getNotificationPreferences
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Settings]
      summary: Update notification preferences
      operationId: patchNotificationPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/notification-app-open:
    post:
      tags: [Settings]
      summary: Record app open for notification scheduling (token-only)
      operationId: postNotificationAppOpen
      security:
        - bearerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/notification-publish-prompt:
    post:
      tags: [Settings]
      summary: Record publish-prompt notification interaction
      operationId: postNotificationPublishPrompt
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/billing-counters:
    get:
      tags: [Settings]
      summary: Billing usage counters
      operationId: getBillingCounters
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/billing-dashboard:
    get:
      tags: [Settings]
      summary: Billing dashboard payload
      operationId: getBillingDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/payment-method/setup-sheet:
    post:
      tags: [Settings]
      summary: Stripe PaymentSheet bootstrap (SetupIntent + ephemeral key)
      operationId: postPaymentMethodSetupSheet
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/payment-method:
    post:
      tags: [Settings]
      summary: Persist payment method after client confirms SetupIntent
      operationId: postCapturePaymentMethod
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/feedback:
    post:
      tags: [Settings]
      summary: Forward in-app feedback to configured webhook
      operationId: postFeedback
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/business/account/deletion:
    post:
      tags: [Business]
      summary: Request account deletion (user-initiated)
      operationId: postBusinessAccountDeletion
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/business/history:
    get:
      tags: [Business]
      summary: Publishing history
      operationId: getPublishingHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/business/history/top:
    get:
      tags: [Business]
      summary: Top publishing history entries
      operationId: getPublishingHistoryTop
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/business/history/refresh:
    get:
      tags: [Business]
      summary: Refresh publishing history from platforms (rate-limited)
      operationId: getPublishingHistoryRefresh
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /onboarding/scan:
    post:
      tags: [Onboarding]
      summary: Start website scan for onboarding
      operationId: postOnboardingScan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/scan-status:
    get:
      tags: [Onboarding]
      summary: Poll scan job status (token-only, pre-registration)
      operationId: getOnboardingScanStatus
      security:
        - bearerToken: []
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/guided-answers:
    post:
      tags: [Onboarding]
      summary: Submit guided onboarding answers
      operationId: postOnboardingGuidedAnswers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/business-profile:
    patch:
      tags: [Onboarding]
      summary: Update business profile during onboarding
      operationId: patchOnboardingBusinessProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/mirror-moment:
    get:
      tags: [Onboarding]
      summary: Get mirror moment summary
      operationId: getMirrorMoment
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/mirror-moment/corrections:
    patch:
      tags: [Onboarding]
      summary: Apply mirror moment corrections
      operationId: patchMirrorMomentCorrections
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/goals:
    post:
      tags: [Onboarding]
      summary: Set onboarding goals
      operationId: postOnboardingGoals
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/preferences:
    patch:
      tags: [Onboarding]
      summary: Update onboarding preferences
      operationId: patchOnboardingPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/daily-hook/trigger-generation:
    post:
      tags: [Onboarding]
      summary: Trigger daily hook generation after mirror moment review
      operationId: postOnboardingTriggerDailyHook
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/daily-hook/schedule-recurring:
    post:
      tags: [Onboarding]
      summary: Schedule recurring daily hook generation
      operationId: postOnboardingScheduleDailyHook
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /onboarding/scan-result:
    post:
      tags: [Onboarding]
      summary: n8n callback with website scan results
      operationId: postOnboardingScanResult
      security:
        - n8nSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/hook:
    get:
      tags: [Today]
      summary: Today's primary hook card and alternatives
      operationId: getTodayHook
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hook deck or empty state (`data` may be null)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        description: Primary hook card and alternatives; null when `meta.emptyState` is true
                        allOf:
                          - $ref: '#/components/schemas/TodayHookCard'
                      meta:
                        type: object
                        properties:
                          calendarDay:
                            type: string
                            pattern: '^\d{4}-\d{2}-\d{2}$'
                          emptyState:
                            type: boolean
                          hookPayloadSource:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/hook/materialize:
    post:
      tags: [Today]
      summary: Materialize today's hook deck for the tenant
      operationId: postTodayHookMaterialize
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Requires ALLOW_FORCE_DAILY_HOOK_REGENERATION on the API
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/hooks/{hookId}/generate-drafts:
    post:
      tags: [Today]
      summary: Generate content drafts for an approved hook
      operationId: postTodayGenerateDrafts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HookId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}:
    patch:
      tags: [Today]
      summary: Save master draft body text
      operationId: patchTodayDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bodyText]
              properties:
                bodyText:
                  type: string
                baseUpdatedAt:
                  type: string
                  format: date-time
                  description: Optional optimistic concurrency token
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/channel-versions:
    get:
      tags: [Today]
      summary: List channel versions for a draft
      operationId: getTodayDraftChannelVersions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/channel-versions/{channelVersionId}:
    patch:
      tags: [Today]
      summary: Save per-channel adapted text
      operationId: patchTodayChannelVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/ChannelVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adaptedText]
              properties:
                adaptedText:
                  type: string
                baseUpdatedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/publish-media-status:
    get:
      tags: [Today]
      summary: Draft media signals for publish UX
      operationId: getTodayDraftPublishMediaStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/media-library:
    get:
      tags: [Today]
      summary: Tenant media library assets
      operationId: getTodayMediaLibrary
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/assets/{assetId}/link:
    post:
      tags: [Today]
      summary: Link library asset to draft
      operationId: postTodayLinkDraftAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/hook/disposition:
    post:
      tags: [Today]
      summary: Approve or skip today's hook
      operationId: postTodayHookDisposition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hookId, action]
              properties:
                hookId:
                  type: string
                action:
                  type: string
                  enum: [approve, skip]
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/prefetch-cascade:
    get:
      tags: [Today]
      summary: Prefetch hook, channel previews, and drafts in one request
      operationId: getTodayPrefetchCascade
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/photo-upload-url:
    post:
      tags: [Today]
      summary: Presigned S3 upload URL for draft-level photo
      operationId: postTodayDraftPhotoUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mimeType]
              properties:
                mimeType:
                  type: string
                  description: image/jpeg, image/png, image/webp, or image/gif
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/photo-attach:
    post:
      tags: [Today]
      summary: Confirm draft photo after S3 upload
      operationId: postTodayDraftPhotoAttach
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoUrl, photoKey]
              properties:
                photoUrl:
                  type: string
                photoKey:
                  type: string
                mimeType:
                  type: string
                diagnosticUploadAttemptId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/photo-upload-client-log:
    post:
      tags: [Today]
      summary: Client diagnostic log for failed photo upload phases
      operationId: postTodayDraftPhotoUploadClientLog
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase:
                  type: string
                  enum: [read_local_blob, s3_put]
                detail:
                  type: string
                httpStatus:
                  type: integer
                mimeType:
                  type: string
                diagnosticUploadAttemptId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/media:
    delete:
      tags: [Today]
      summary: Clear draft-level media
      operationId: deleteTodayDraftMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/channel-versions/{channelVersionId}/photo-upload-url:
    post:
      tags: [Today]
      summary: Presigned upload URL for per-channel photo
      operationId: postTodayChannelVersionPhotoUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/ChannelVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mimeType]
              properties:
                mimeType:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/channel-versions/{channelVersionId}/photo-attach:
    post:
      tags: [Today]
      summary: Confirm per-channel photo after S3 upload
      operationId: postTodayChannelVersionPhotoAttach
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/ChannelVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoUrl, photoKey]
              properties:
                photoUrl:
                  type: string
                photoKey:
                  type: string
                mimeType:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessJson'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /today/drafts/{draftId}/channel-versions/{channelVersionId}/assets/{assetId}/link:
    post:
      tags: [Today]
      summary: Link library asset to channel version
      operationId: postTodayLinkChannelVersionAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
